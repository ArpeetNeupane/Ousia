<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat WebSocket Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #10b981;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .config-section {
            padding: 20px 25px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .config-section label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .config-section input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .config-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .config-section button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .config-section button:hover {
            background: #5568d3;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: #f1f5f9;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }

        .message.system {
            align-self: center;
            background: #fef3c7;
            color: #92400e;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 12px;
        }

        .message.error {
            align-self: center;
            background: #fee2e2;
            color: #991b1b;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 12px;
        }

        .message-meta {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .typing-indicator {
            align-self: flex-start;
            padding: 12px 16px;
            background: #f1f5f9;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            font-size: 13px;
            color: #64748b;
            font-style: italic;
        }

        .input-area {
            padding: 20px 25px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #messageInput {
            width: 100%;
            padding: 14px 50px 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .action-buttons {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 4px;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
        }

        .btn-send:hover {
            transform: scale(1.05);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            text-align: center;
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #64748b;
        }

        .empty-state p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Chat WebSocket Test</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <div class="config-section" id="configSection">
            <label for="conversationIdInput">Conversation ID (UUID):</label>
            <input type="text" id="conversationIdInput" placeholder="e.g., 123e4567-e89b-12d3-a456-426614174000">
            <button onclick="connectWebSocket()">Connect</button>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="empty-state">
                <div class="empty-state-icon">🚀</div>
                <h3>Ready to Test WebSocket</h3>
                <p>Enter a conversation ID above and click Connect to start</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type a message..." 
                    disabled
                    onkeypress="handleKeyPress(event)"
                    oninput="handleTyping()"
                >
            </div>
            <button class="btn btn-send" onclick="sendMessage()" id="sendBtn" disabled>
                Send ✈️
            </button>
        </div>
    </div>

    <script>
        let ws = null;
        let typingTimeout = null;
        let isTyping = false;

        function connectWebSocket() {
            const conversationId = document.getElementById('conversationIdInput').value.trim();
            
            if (!conversationId) {
                addMessage('Please enter a conversation ID', 'error');
                return;
            }

            if (ws) {
                ws.close();
            }

            // Update to match your Django server URL
            const wsUrl = `ws://localhost:8000/ws/chat/${conversationId}/`;
            
            addMessage(`Connecting to: ${wsUrl}`, 'system');
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus(true);
                addMessage('Connected successfully! 🎉', 'system');
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('configSection').style.display = 'none';
            };

            ws.onclose = () => {
                updateStatus(false);
                addMessage('Disconnected from server', 'system');
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
            };

            ws.onerror = (error) => {
                addMessage('Connection error. Check console for details.', 'error');
                console.error('WebSocket error:', error);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleIncomingMessage(data);
            };
        }

        function handleIncomingMessage(data) {
            switch(data.type) {
                case 'connection_established':
                    // Already handled in onopen
                    break;
                
                case 'new_message':
                    const msg = data.message;
                    const isOwn = false; // You'd need to track this based on sender
                    addMessage(msg.content, isOwn ? 'sent' : 'received', msg);
                    break;
                
                case 'message_edited':
                    addMessage(`Message edited: ${data.message.content}`, 'system');
                    break;
                
                case 'message_deleted':
                    addMessage(`Message deleted (ID: ${data.message_id})`, 'system');
                    break;
                
                case 'typing_indicator':
                    handleTypingIndicator(data);
                    break;
                
                case 'error':
                    addMessage(`Error: ${data.message}`, 'error');
                    break;
                
                default:
                    console.log('Unknown message type:', data);
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content || !ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            ws.send(JSON.stringify({
                action: 'send_message',
                content: content,
                message_type: 'text'
            }));

            addMessage(content, 'sent');
            input.value = '';
            
            // Stop typing indicator
            if (isTyping) {
                sendTypingIndicator(false);
            }
        }

        function handleTyping() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            // Send typing indicator
            if (!isTyping) {
                sendTypingIndicator(true);
                isTyping = true;
            }

            // Clear existing timeout
            clearTimeout(typingTimeout);

            // Set timeout to stop typing indicator
            typingTimeout = setTimeout(() => {
                sendTypingIndicator(false);
                isTyping = false;
            }, 2000);
        }

        function sendTypingIndicator(typing) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: 'typing_indicator',
                    is_typing: typing
                }));
            }
        }

        function handleTypingIndicator(data) {
            const container = document.getElementById('messagesContainer');
            const existingIndicator = document.getElementById('typingIndicator');

            if (data.is_typing) {
                if (!existingIndicator) {
                    const indicator = document.createElement('div');
                    indicator.id = 'typingIndicator';
                    indicator.className = 'typing-indicator';
                    indicator.textContent = `${data.username} is typing...`;
                    container.appendChild(indicator);
                    scrollToBottom();
                }
            } else {
                if (existingIndicator) {
                    existingIndicator.remove();
                }
            }
        }

        function addMessage(content, type = 'received', messageData = null) {
            const container = document.getElementById('messagesContainer');
            const emptyState = container.querySelector('.empty-state');
            
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.textContent = content;
            messageDiv.appendChild(contentDiv);

            if (messageData && type !== 'system' && type !== 'error') {
                const metaDiv = document.createElement('div');
                metaDiv.className = 'message-meta';
                const time = new Date(messageData.created_at || Date.now()).toLocaleTimeString();
                metaDiv.textContent = `${messageData.sender?.username || 'You'} • ${time}`;
                messageDiv.appendChild(metaDiv);
            }

            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        function updateStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Auto-focus input when page loads
        window.onload = () => {
            document.getElementById('conversationIdInput').focus();
        };
    </script>
</body>
</html>
